<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>말하기 연습</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%2317171a%22/><rect x=%2242%22 y=%2224%22 width=%2216%22 height=%2234%22 rx=%228%22 fill=%22%23fff%22/><path d=%22M30 50v4a20 20 0 0 0 40 0v-4%22 stroke=%22%23fff%22 stroke-width=%227%22 fill=%22none%22 stroke-linecap=%22round%22/><line x1=%2250%22 y1=%2278%22 x2=%2250%22 y2=%2288%22 stroke=%22%23fff%22 stroke-width=%227%22 stroke-linecap=%22round%22/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --page-bg: #eae8e1;
    --surface: #ffffff;
    --surface-2: #f1efe8;
    --border: #e4e1d9;
    --text: #17171a;
    --text-muted: #6f6d66;
    --text-faint: #a6a399;
    --accent: #1f6f54;
    --accent-strong: #17573f;
    --accent-soft: #e1efe8;
    --danger: #b3403a;
    --danger-soft: #f7e8e5;
    --warn: #9c7714;
    --warn-soft: #f4edd8;
    --shadow-sm: 0 1px 2px rgba(20,20,15,0.05);
    --shadow-lg: 0 1px 2px rgba(20,20,15,0.04), 0 24px 48px rgba(20,20,15,0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page-bg: #0b0b0c;
      --surface: #1c1c1e;
      --surface-2: #262628;
      --border: #313133;
      --text: #f2f1ee;
      --text-muted: #9d9b95;
      --text-faint: #6d6b66;
      --accent: #4fc39a;
      --accent-strong: #7ad9b6;
      --accent-soft: rgba(79,195,154,0.14);
      --danger: #e3897f;
      --danger-soft: rgba(227,137,127,0.14);
      --warn: #dcb45f;
      --warn-soft: rgba(220,180,95,0.14);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-lg: 0 1px 2px rgba(0,0,0,0.4), 0 24px 48px rgba(0,0,0,0.55);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--text);
    font-family: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .app-frame {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  @media (min-width: 640px) {
    body { display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .app-frame {
      max-width: 420px;
      height: min(840px, 92vh);
      border-radius: 28px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
    }
  }

  /* ---------- header ---------- */
  .appbar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 12px;
    border-bottom: 1px solid var(--border);
  }
  .profile-chip { background: none; border: none; padding: 0; cursor: pointer; }
  .chip-avatar {
    position: relative;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
  }
  .profile-chip:active .chip-avatar { transform: scale(0.94); }
  .char-emoji { font-size: 19px; line-height: 1; }
  .level-badge {
    position: absolute;
    right: -3px;
    bottom: -3px;
    min-width: 17px;
    height: 17px;
    padding: 0 3px;
    border-radius: 999px;
    background: var(--text);
    color: var(--surface);
    font-size: 9.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--surface);
  }
  .appbar-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .appbar-meta .tag {
    background: var(--surface-2);
    color: var(--text-muted);
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }
  .appbar-meta .counter { color: var(--text-faint); white-space: nowrap; }
  .appbar-meta .counter b { color: var(--text-muted); font-weight: 600; }

  /* ---------- stage (flashcard) ---------- */
  .stage {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 18px;
    padding: 28px 26px;
  }
  .stage-toolbar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .blank-tag {
    font-size: 10.5px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--warn-soft);
    color: var(--warn);
  }
  .listen-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 500;
    padding: 4px 10px 4px 8px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .listen-btn svg { width: 13px; height: 13px; }
  .listen-btn:hover { background: var(--surface-2); color: var(--text); }
  .listen-btn:active { transform: scale(0.96); }
  .listen-btn[hidden] { display: none; }
  .target-text {
    margin: 0;
    font-weight: 700;
    font-size: clamp(22px, 6.6vw, 32px);
    line-height: 1.45;
    color: var(--text);
    word-break: keep-all;
    max-width: 360px;
  }

  /* ---------- dock (controls) ---------- */
  .dock {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 20px calc(18px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
  }
  canvas#waveform { width: 100%; max-width: 300px; height: 28px; }

  .hold-wrap {
    --progress: 0;
    position: relative;
    width: 92px;
    height: 92px;
    margin-top: 2px;
  }
  .hold-wrap::before {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: conic-gradient(var(--accent) calc(var(--progress) * 360deg), var(--border) 0);
  }
  .hold-btn {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: none;
    background: var(--text);
    color: var(--surface);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    box-shadow: var(--shadow-sm);
    transition: transform 0.12s ease, background 0.2s ease, color 0.2s ease;
  }
  .hold-btn svg { width: 28px; height: 28px; pointer-events: none; }
  .hold-wrap.active .hold-btn { transform: scale(1.06); background: var(--danger); color: #fff; }
  .hold-wrap.active .hold-btn svg { animation: micPulse 1s ease-in-out infinite; }
  @keyframes micPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

  .hold-label {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-faint);
    margin-top: 10px;
    text-align: center;
    min-height: 16px;
  }
  .hold-wrap.active + .hold-label { color: var(--danger); }

  .draw-btn {
    margin-top: 12px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-weight: 500;
    font-size: 12.5px;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .draw-btn:hover { background: var(--surface-2); }
  .draw-btn:active { transform: scale(0.96); }
  .draw-btn .draw-icon { display: inline-flex; transition: transform 0.35s ease; }
  .draw-btn.spin .draw-icon { transform: rotate(180deg); }

  .status { font-size: 12px; color: var(--danger); margin-top: 8px; min-height: 15px; text-align: center; }
  .site-banner {
    margin-top: 12px;
    width: 100%;
    max-width: 300px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 14px;
    background: var(--accent-soft);
    color: var(--accent-strong);
    border: none;
    font: inherit;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .site-banner:hover { box-shadow: var(--shadow-sm); transform: translateY(-1px); }
  .site-banner:active { transform: translateY(0) scale(0.98); }
  .site-banner-icon {
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }
  .site-banner-text { flex: 1; min-width: 0; text-align: left; }
  .site-banner-kicker { font-size: 10px; font-weight: 600; opacity: 0.75; }
  .site-banner-title { font-size: 13px; font-weight: 700; }
  .site-banner-arrow { flex: none; font-size: 15px; transition: transform 0.2s ease; }
  .site-banner[aria-expanded="true"] .site-banner-arrow { transform: rotate(90deg); }

  /* ---------- sites sheet ---------- */
  .site-list { display: flex; flex-direction: column; gap: 8px; padding-bottom: 4px; }
  .site-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border-radius: 14px;
    text-decoration: none;
    color: inherit;
    transition: background 0.15s ease;
  }
  .site-row:hover { background: var(--surface-2); }
  .site-row:active { transform: scale(0.98); }
  .site-row-icon {
    flex: none;
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .site-row-text { flex: 1; min-width: 0; }
  .site-row-title { display: block; font-size: 13.5px; font-weight: 700; color: var(--text); }
  .site-row-desc { display: block; font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }
  .site-row-go { flex: none; color: var(--text-faint); font-size: 15px; }

  /* ---------- bottom sheets ---------- */
  .sheet-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(15,15,13,0.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 50;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: relative;
    width: 100%;
    max-height: 86%;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -14px 34px rgba(0,0,0,0.14);
    padding: 14px 22px calc(22px + env(safe-area-inset-bottom, 0px));
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.32,0.72,0,1);
  }
  .sheet-backdrop.open .sheet { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: var(--border); margin: 0 auto 14px; }
  .sheet-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: var(--surface-2);
    color: var(--text-faint);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
  }
  .sheet-close:hover { color: var(--text); }

  /* ---------- stats sheet ---------- */
  .stats-summary { padding-top: 4px; }
  .stats-level { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
  .stats-level b { font-weight: 700; }
  .xp-bar { height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; margin-bottom: 6px; }
  .xp-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.3s ease; }
  .xp-label { font-size: 11.5px; color: var(--text-faint); margin-bottom: 20px; }
  .stats-badges-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .stamp-count { font-size: 11.5px; font-weight: 600; color: var(--text-faint); }
  .stamp-book { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; padding-bottom: 4px; }
  .stamp-chip {
    aspect-ratio: 1;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-2);
    border: 1px dashed var(--border);
    color: var(--text-faint);
  }
  .stamp-chip svg { width: 15px; height: 15px; }
  .stamp-chip.earned { border: 1px solid transparent; background: var(--accent-soft); color: var(--accent-strong); }

  /* ---------- result sheet ---------- */
  .level-banner {
    display: none;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-strong);
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 9px 12px;
    margin-bottom: 14px;
    text-align: center;
  }
  .level-banner.show { display: block; }
  .result-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-faint);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .recognized {
    font-size: clamp(18px, 5.6vw, 22px);
    font-weight: 600;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 6px;
  }
  .word { padding: 1px 3px; border-radius: 4px; }
  .word.equal { background: var(--accent-soft); }
  .word.replace, .word.delete {
    background: var(--danger-soft);
    text-decoration: underline solid var(--danger);
    text-decoration-thickness: 1.5px;
  }
  .word.insert { background: var(--warn-soft); }

  .score-row { display: flex; align-items: center; gap: 14px; margin: 14px 0 6px; flex-wrap: wrap; }
  .score-stamp {
    flex: none;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: var(--surface-2);
    color: var(--text);
  }
  .score-stamp .num { font-size: 22px; font-weight: 700; line-height: 1; }
  .score-stamp .unit { font-size: 10.5px; margin-top: 3px; color: var(--text-faint); }
  .score-chips { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; min-width: 160px; }
  .score-chip {
    font-size: 11.5px;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text-muted);
    white-space: nowrap;
  }
  .score-chip b { color: var(--text); font-weight: 700; }

  .verdict {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 14px;
    padding: 6px 14px 6px 8px;
    border-radius: 999px;
    margin: 8px 0 14px;
  }
  .verdict.correct { background: var(--accent-soft); color: var(--accent-strong); }
  .verdict.wrong { background: var(--danger-soft); color: var(--danger); }
  .verdict::before {
    content: "";
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
  }
  .verdict.correct::before { content: "✓"; background: var(--accent); }
  .verdict.wrong::before { content: "✕"; background: var(--danger); }

  .note {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 13px 14px;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text);
  }
  .note-icon { flex: none; margin-top: 1px; color: var(--accent); }
  .note-icon svg { width: 15px; height: 15px; display: block; }

  audio { width: 100%; margin-top: 14px; display: none; height: 32px; }
  .grader-badge { font-size: 10.5px; color: var(--text-faint); margin-top: 10px; text-align: right; }

  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-btn {
    flex: 1;
    padding: 11px 10px;
    border-radius: 999px;
    font-family: inherit;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .modal-btn.secondary { background: var(--surface); border-color: var(--border); color: var(--text); }
  .modal-btn.secondary:hover { background: var(--surface-2); }
  .modal-btn.primary { background: var(--text); color: var(--surface); }
  .modal-btn:active { transform: scale(0.97); }
</style>
</head>
<body>
<div class="app-frame" id="appFrame">

  <header class="appbar">
    <button class="profile-chip" id="profileChip" type="button" aria-label="레벨과 배지 보기">
      <span class="chip-avatar">
        <span class="char-emoji" id="charEmoji">🥚</span>
        <span class="level-badge" id="levelBadge">1</span>
      </span>
    </button>
    <div class="appbar-meta">
      <span class="tag" id="itemTag">-</span>
      <span class="counter">No. <b id="pageNo">1</b></span>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="stage-toolbar">
      <span class="blank-tag" id="blankTag" style="display:none">빈칸 채우기</span>
      <button class="listen-btn" id="listenBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        들어보기
      </button>
    </div>
    <p class="target-text" id="targetText">불러오는 중...</p>
  </main>

  <footer class="dock">
    <canvas id="waveform" width="420" height="80"></canvas>
    <div class="hold-wrap" id="holdWrap">
      <button class="hold-btn" id="recordBtn" aria-label="누르고 있는 동안 녹음됩니다">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 10v1a7 7 0 0 0 14 0v-1"></path>
          <line x1="12" y1="18" x2="12" y2="22"></line>
          <line x1="8" y1="22" x2="16" y2="22"></line>
        </svg>
      </button>
    </div>
    <div class="hold-label" id="holdLabel">누르고 있는 동안 녹음돼요</div>
    <button class="draw-btn" id="nextBtn">
      <span class="draw-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg></span>
      <span>다른 카드 뽑기</span>
    </button>
    <div class="status" id="status"></div>
    <button class="site-banner" id="sitesToggle" type="button" aria-expanded="false" aria-controls="sitesSheet">
      <span class="site-banner-icon">🧭</span>
      <span class="site-banner-text">
        <span class="site-banner-kicker">만든 미니 사이트 모아보기</span>
        <span class="site-banner-title">둘러보기</span>
      </span>
      <span class="site-banner-arrow">→</span>
    </button>
  </footer>

  <div class="sheet-backdrop" id="statsBackdrop">
    <div class="sheet stats-sheet" id="statsSheet" role="dialog" aria-label="레벨과 배지">
      <div class="sheet-handle"></div>
      <button class="sheet-close" id="statsClose" aria-label="닫기">✕</button>
      <div class="stats-summary">
        <div class="stats-level">Lv.<b id="charLevel">1</b> <span id="charName">알</span></div>
        <div class="xp-bar"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
        <div class="xp-label" id="xpLabel">0/20 XP</div>
      </div>
      <div class="stats-badges-header"><span>달성 배지</span><span class="stamp-count" id="stampCount">0/0</span></div>

<script>
const API = "";
const MAX_MS = 20000;
const TOKEN_KEY = "voiceGraderToken";

(function persistTokenFromUrl() {
  try {
    const params = new URLSearchParams(location.search);
    const t = params.get("token");
    if (t) localStorage.setItem(TOKEN_KEY, t);
  } catch (e) { /* localStorage unavailable, ignore */ }
})();

function getToken() {
  try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; }
}

const DEVICE_KEY = "voiceGraderDeviceId";
function getDeviceId() {
  try {
    let id = localStorage.getItem(DEVICE_KEY);
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : `dev-${Date.now()}-${Math.random().toString(16).slice(2)}`);
      localStorage.setItem(DEVICE_KEY, id);
    }
    return id;
  } catch (e) { return null; }
}
const deviceId = getDeviceId();

let items = [];
let currentItem = null;
let drawCount = 0;
let profile = { level: 1, total_xp: 0, xp_into_level: 0, xp_for_next_level: 20, stamps: [], character_emoji: "🥚", character_name: "알" };
let mediaRecorder = null;
let chunks = [];
let recording = false;
let stopTimer = null;
let audioCtx = null, analyser = null, sourceNode = null, rafId = null;
let holdStartTime = 0;

const el = (id) => document.getElementById(id);

const CHECK_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
const LOCK_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`;

let ttsVoices = [];
if ("speechSynthesis" in window) {
  ttsVoices = window.speechSynthesis.getVoices();
  window.speechSynthesis.addEventListener("voiceschanged", () => {
    ttsVoices = window.speechSynthesis.getVoices();
  });
} else {
  el("listenBtn").hidden = true;
}

function stopSpeaking() {
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
}

function speak(text, language) {
  if (!("speechSynthesis" in window)) return;
  stopSpeaking();
  const lang = language === "ko" ? "ko-KR" : "en-US";
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang;
  utter.rate = 0.9;
  const voice = ttsVoices.find((v) => v.lang === lang) || ttsVoices.find((v) => v.lang.startsWith(lang.slice(0, 2)));
  if (voice) utter.voice = voice;
  window.speechSynthesis.speak(utter);
}

el("listenBtn").addEventListener("click", () => {
  if (currentItem) speak(currentItem.text, currentItem.language);
});

async function loadItems() {
  const [itemsRes] = await Promise.all([fetch(`${API}/api/items`), fetchProfile()]);
  items = await itemsRes.json();
  renderProfileBar();
  renderStampBook();
  drawRandomItem();
}

async function fetchProfile() {
  if (!deviceId) return;
  try {
    const res = await fetch(`${API}/api/profile?device_id=${encodeURIComponent(deviceId)}`);
    if (res.ok) profile = await res.json();
  } catch (e) { /* offline or first run; keep default profile */ }
}

function renderProfileBar() {
  el("charEmoji").textContent = profile.character_emoji;
  el("levelBadge").textContent = profile.level;
  el("charLevel").textContent = profile.level;
  el("charName").textContent = profile.character_name;
  const pct = Math.round((profile.xp_into_level / profile.xp_for_next_level) * 100);
  el("xpFill").style.width = `${pct}%`;
  el("xpLabel").textContent = `${profile.xp_into_level}/${profile.xp_for_next_level} XP`;
  el("stampCount").textContent = `${profile.stamps.length}/${items.length || "-"}`;
}

function renderStampBook() {
  el("stampBook").innerHTML = items
    .map((it) => {
      const earned = profile.stamps.includes(it.id);
      return `<span class="stamp-chip ${earned ? "earned" : ""}" title="${escapeHtml(it.text)}">${earned ? CHECK_ICON : LOCK_ICON}</span>`;
    })
    .join("");
}

function unlockedPool() {
  const pool = items.filter((it) => it.unlock_level <= profile.level);
  return pool.length ? pool : items;
}

function displayTextFor(item) {
  if (item.mode === "fill_blank" && item.blank_index != null) {
    const words = item.text.split(" ");
    words[item.blank_index] = "_____";
    return words.join(" ");
  }
  return item.text;
}

function drawRandomItem() {
  const pool = unlockedPool();
  let next = currentItem;
  if (pool.length > 1) {
    while (!next || next.id === currentItem?.id) {
      next = pool[Math.floor(Math.random() * pool.length)];
    }
  } else {
    next = pool[0];
  }
  currentItem = next;
  drawCount += 1;
  el("pageNo").textContent = `${drawCount}`;
  el("itemTag").textContent = `${currentItem.language === "ko" ? "한국어" : "English"} · ${currentItem.level === "word" ? "단어" : "문장"}`;
  el("targetText").textContent = displayTextFor(currentItem);
  el("blankTag").style.display = currentItem.mode === "fill_blank" ? "inline-block" : "none";
  el("listenBtn").hidden = currentItem.mode === "fill_blank";
  stopSpeaking();
  el("playback").style.display = "none";
  el("status").textContent = "";
  closeModal();
}

el("nextBtn").addEventListener("click", (e) => {
  e.currentTarget.classList.add("spin");
  setTimeout(() => e.currentTarget.classList.remove("spin"), 400);
  drawRandomItem();
});

function openModal() { el("modalBackdrop").classList.add("open"); }
function closeModal() { el("modalBackdrop").classList.remove("open"); }
el("modalClose").addEventListener("click", closeModal);
el("modalBackdrop").addEventListener("click", (e) => { if (e.target === e.currentTarget) closeModal(); });
el("modalRetry").addEventListener("click", closeModal);
el("modalNext").addEventListener("click", () => { drawRandomItem(); });

function openStats() { el("statsBackdrop").classList.add("open"); }
function closeStats() { el("statsBackdrop").classList.remove("open"); }
el("profileChip").addEventListener("click", openStats);
el("statsClose").addEventListener("click", closeStats);
el("statsBackdrop").addEventListener("click", (e) => { if (e.target === e.currentTarget) closeStats(); });

function openSites() { el("sitesBackdrop").classList.add("open"); el("sitesToggle").setAttribute("aria-expanded", "true"); }
function closeSites() { el("sitesBackdrop").classList.remove("open"); el("sitesToggle").setAttribute("aria-expanded", "false"); }
el("sitesToggle").addEventListener("click", openSites);
el("sitesClose").addEventListener("click", closeSites);
el("sitesBackdrop").addEventListener("click", (e) => { if (e.target === e.currentTarget) closeSites(); });

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeModal(); closeStats(); closeSites(); }
});

function setupVisualizer(stream) {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  sourceNode = audioCtx.createMediaStreamSource(stream);
  sourceNode.connect(analyser);

  const canvas = el("waveform");
  const ctx = canvas.getContext("2d");
  const bufferLength = analyser.fftSize;
  const dataArray = new Uint8Array(bufferLength);
  const holdWrap = el("holdWrap");

  function render() {
    if (!recording) return;
    rafId = requestAnimationFrame(render);

    const elapsed = performance.now() - holdStartTime;
    holdWrap.style.setProperty("--progress", Math.min(elapsed / MAX_MS, 1).toFixed(3));

    analyser.getByteTimeDomainData(dataArray);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = "#b3403a";
    ctx.beginPath();
    const sliceWidth = canvas.width / bufferLength;
    let x = 0;
    for (let i = 0; i < bufferLength; i++) {
      const v = dataArray[i] / 128.0;
      const y = (v * canvas.height) / 2;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      x += sliceWidth;
    }
    ctx.stroke();
  }
  render();
}

function teardownVisualizer() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  const canvas = el("waveform");
  canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
  el("holdWrap").style.setProperty("--progress", 0);
}

const MIME_CANDIDATES = ["audio/webm", "audio/mp4", "audio/aac", "audio/ogg"];
function pickMimeType() {
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return "";
  return MIME_CANDIDATES.find((t) => MediaRecorder.isTypeSupported(t)) || "";
}

async function beginHold() {
  if (recording) return;
  stopSpeaking();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
        channelCount: 1,
        sampleRate: 16000,
      },
    });
    chunks = [];
    const mimeType = pickMimeType();
    const recorderOpts = { audioBitsPerSecond: 128000 };
    if (mimeType) recorderOpts.mimeType = mimeType;
    mediaRecorder = new MediaRecorder(stream, recorderOpts);
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = onRecordingStop;
    mediaRecorder.start();
    recording = true;
    holdStartTime = performance.now();
    setupVisualizer(stream);
    el("holdWrap").classList.add("active");
    el("holdLabel").textContent = "듣고 있어요… 다 읽으면 손을 떼세요";
    el("status").textContent = "";
    stopTimer = setTimeout(() => endHold(), MAX_MS);
  } catch (err) {
    el("status").textContent = "마이크 접근 권한이 필요합니다: " + err.message;
  }
}

function endHold() {
  if (stopTimer) clearTimeout(stopTimer);
  if (mediaRecorder && recording) {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach((t) => t.stop());
  }
  recording = false;
  teardownVisualizer();
  el("holdWrap").classList.remove("active");
  el("holdLabel").textContent = "누르고 있는 동안 녹음돼요";
}

const recordBtn = el("recordBtn");
recordBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); beginHold(); });
recordBtn.addEventListener("contextmenu", (e) => e.preventDefault());
window.addEventListener("pointerup", () => { if (recording) endHold(); });
window.addEventListener("pointercancel", () => { if (recording) endHold(); });
recordBtn.addEventListener("keydown", (e) => {
  if ((e.code === "Space" || e.code === "Enter") && !e.repeat) { e.preventDefault(); beginHold(); }
});
recordBtn.addEventListener("keyup", (e) => {
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); endHold(); }
});

async function onRecordingStop() {
  const mimeType = mediaRecorder.mimeType || "audio/webm";
  const ext = mimeType.includes("mp4") ? "mp4" : mimeType.includes("ogg") ? "ogg" : "webm";
  const blob = new Blob(chunks, { type: mimeType });
  const url = URL.createObjectURL(blob);
  el("playback").src = url;
  el("playback").style.display = "block";
  el("holdLabel").textContent = "채점 중…";
  el("status").textContent = "";

  const form = new FormData();
  form.append("item_id", currentItem.id);
  form.append("audio", blob, `recording.${ext}`);
  const token = getToken();
  if (token) form.append("token", token);
  if (deviceId) form.append("device_id", deviceId);

  try {
    const res = await fetch(`${API}/api/grade`, { method: "POST", body: form });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    showResult(data);
  } catch (err) {
    el("status").textContent = "채점 실패: " + err.message;
  } finally {
    el("holdLabel").textContent = "누르고 있는 동안 녹음돼요";
  }
}

function showResult(data) {
  const recognizedEl = el("recognizedText");
  recognizedEl.innerHTML = data.diff_ops.map((op) => {
    const text = op.recognized || `[ ${op.target} ]`;
    return `<span class="word ${op.op}">${escapeHtml(text)}</span>`;
  }).join(" ") || "<em>(인식된 내용 없음)</em>";

  const s = data.scores;
  el("scoreOverall").textContent = s.overall;
  const chips = [
    ["정확도", s.accuracy],
    ["완성도", s.completeness],
    ["유창성", s.fluency],
    ["문자유사도", s.char_similarity],
  ].filter(([, v]) => v !== null && v !== undefined);
  el("scoreChips").innerHTML = chips
    .map(([label, v]) => `<span class="score-chip">${label} <b>${v}%</b></span>`)
    .join("");

  const verdictEl = el("verdict");
  verdictEl.textContent = data.correct ? "참 잘했어요" : "다시 읽어볼까요";
  verdictEl.className = "verdict " + (data.correct ? "correct" : "wrong");

  el("feedback").textContent = data.feedback;
  el("graderBadge").textContent = `grader: ${data.grader}`;

  const banner = el("levelBanner");
  banner.className = "level-banner";
  if (data.profile) {
    profile = data.profile;
    renderProfileBar();
    renderStampBook();
    const messages = [];
    if (data.profile.leveled_up) messages.push(`레벨 업! Lv.${profile.level} ${profile.character_name}(으)로 진화했어요`);
    if (data.profile.new_stamp) messages.push("새 배지를 획득했어요");
    if (messages.length) {
      banner.textContent = messages.join(" · ");
      banner.classList.add("show");
    }
  }

  openModal();
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

loadItems();
</script>
