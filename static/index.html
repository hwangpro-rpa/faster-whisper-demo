<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>말하기 연습장</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✏️</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --desk: #3d3226;
    --desk-shadow: rgba(0,0,0,0.45);
    --paper: #faf5e6;
    --paper-edge: #efe6cf;
    --rule: rgba(94,128,171,0.38);
    --margin: #c8574a;
    --pen-blue: #2c4a73;
    --pen-blue-soft: #5872a1;
    --pen-red: #b5432f;
    --pen-green: #46693c;
    --ink: #20262f;
    --ink-muted: #8a8171;
    --marker-yellow: rgba(255, 214, 92, 0.55);
    --marker-green: rgba(150, 199, 128, 0.45);
    --highlighter: rgba(255, 224, 102, 0.65);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255,255,255,0.06), transparent 60%),
      repeating-linear-gradient(115deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 6px),
      var(--desk);
    color: var(--pen-blue);
    font-family: "IBM Plex Sans KR", -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    min-height: 100%;
  }

  .sheet {
    width: 100%;
    max-width: 620px;
    background: var(--paper);
    background-image:
      linear-gradient(to right, transparent 0 54px, var(--margin) 54px 55.5px, transparent 55.5px),
      repeating-linear-gradient(to bottom, transparent 0 37px, var(--rule) 37px 38px);
    box-shadow: 0 24px 50px var(--desk-shadow), 0 2px 0 var(--paper-edge);
    border-radius: 3px;
    padding: 34px 30px 34px 74px;
    transform: rotate(-0.4deg);
    position: relative;
  }
  .sheet::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 3px;
    box-shadow: inset 0 0 40px rgba(60,45,20,0.06);
    pointer-events: none;
  }

  .kicker {
    font-size: 12px;
    color: var(--ink-muted);
    letter-spacing: 0.04em;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 2px;
  }
  .kicker b { color: var(--pen-blue); font-weight: 700; }
  h1 {
    font-family: "Gaegu", "IBM Plex Sans KR", sans-serif;
    font-size: 26px;
    margin: 0 0 20px;
    color: var(--pen-blue);
  }

  .target-wrap { margin: 4px 0 26px; }
  .target-hint {
    font-size: 11.5px;
    color: var(--ink-muted);
    letter-spacing: 0.03em;
    margin-bottom: 6px;
  }
  .target-text {
    display: inline;
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1.5;
    color: var(--ink);
    word-break: keep-all;
    background: linear-gradient(transparent 62%, var(--highlighter) 62%);
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }

  .practice-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 0 4px;
  }

  .hold-wrap {
    --progress: 0;
    position: relative;
    width: 108px;
    height: 108px;
  }
  .hold-wrap::before {
    content: "";
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    background: conic-gradient(var(--pen-red) calc(var(--progress) * 360deg), transparent 0);
  }
  .hold-btn {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 2.5px solid var(--pen-blue);
    background: var(--paper);
    color: var(--pen-blue);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    transition: transform 0.12s ease, background 0.2s ease, color 0.2s ease;
  }
  .hold-btn svg { width: 34px; height: 34px; pointer-events: none; }
  .hold-wrap.active .hold-btn {
    transform: scale(1.08);
    background: #eef2f8;
    color: var(--pen-red);
    border-color: var(--pen-red);
  }
  .hold-wrap.active .hold-btn svg { animation: micPulse 1s ease-in-out infinite; }
  @keyframes micPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

  .hold-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-muted);
    margin-top: 12px;
    text-align: center;
    min-height: 18px;
  }
  .hold-wrap.active + .hold-label { color: var(--pen-red); }

  canvas#waveform {
    width: 100%;
    max-width: 420px;
    height: 40px;
    margin-top: 6px;
  }

  .draw-btn {
    margin-top: 18px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--paper-edge);
    border: 1.5px dashed var(--pen-blue-soft);
    color: var(--pen-blue);
    font-family: inherit;
    font-weight: 600;
    font-size: 13.5px;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .draw-btn:hover { background: #f1e9d2; transform: translateY(-1px); }
  .draw-btn:active { transform: translateY(0) scale(0.96); }
  .draw-btn .draw-icon { display: inline-block; transition: transform 0.4s ease; }
  .draw-btn.spin .draw-icon { transform: rotate(360deg); }

  audio { width: 100%; margin-top: 14px; display: none; height: 32px; }
  .status { font-size: 12.5px; color: var(--ink-muted); margin-top: 10px; min-height: 16px; text-align: center; }

  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20,15,8,0.6);
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    z-index: 100;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    position: relative;
    width: 100%;
    max-width: 440px;
    max-height: 88vh;
    overflow-y: auto;
    background: var(--paper);
    border-radius: 8px;
    box-shadow: 0 20px 55px rgba(0,0,0,0.55);
    padding: 30px 22px 20px;
    transform: rotate(-0.6deg);
    animation: modalIn 0.16s ease-out;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: rotate(-0.6deg) scale(0.95); }
    to { opacity: 1; transform: rotate(-0.6deg) scale(1); }
  }
  .modal-close {
    position: absolute;
    top: 8px;
    right: 10px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: none;
    color: var(--ink-muted);
    font-size: 16px;
    cursor: pointer;
  }
  .modal-close:hover { background: var(--paper-edge); color: var(--ink); }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-btn {
    flex: 1;
    padding: 11px 10px;
    border-radius: 999px;
    font-family: inherit;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
  }
  .modal-btn.secondary { background: var(--paper-edge); border: 1.5px dashed var(--pen-blue-soft); color: var(--pen-blue); }
  .modal-btn.primary { background: var(--pen-blue); border: 1.5px solid var(--pen-blue); color: var(--paper); }
  .modal-btn:active { transform: scale(0.96); }

  .result-label {
    font-size: 11px;
    color: var(--ink-muted);
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .recognized {
    font-family: "Gaegu", "IBM Plex Sans KR", sans-serif;
    font-size: 26px;
    line-height: 1.7;
    color: var(--pen-red);
    margin-bottom: 4px;
  }
  .word { padding: 0 2px; }
  .word.equal { background: linear-gradient(transparent 60%, var(--marker-green) 60%); }
  .word.replace, .word.delete {
    text-decoration: wavy underline var(--pen-red);
    text-decoration-thickness: 1.5px;
  }
  .word.insert { background: linear-gradient(transparent 55%, var(--marker-yellow) 55%); }

  .verdict {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: "Gaegu", sans-serif;
    font-weight: 700;
    font-size: 20px;
    margin: 6px 0 10px;
    transform: rotate(-2deg);
  }
  .verdict.correct { color: var(--pen-green); }
  .verdict.wrong { color: var(--pen-red); }
  .verdict::before { content: ""; display: inline-block; width: 22px; height: 22px; border-radius: 50%; border: 3px solid currentColor; }
  .verdict.correct::before { border-radius: 4px; transform: rotate(45deg) scale(0.8); border-width: 0 3px 3px 0; width: 8px; height: 14px; margin: 0 8px 4px 4px; }

  .note {
    background: #fdf7e3;
    border: 1px solid rgba(0,0,0,0.06);
    box-shadow: 2px 3px 8px rgba(0,0,0,0.12);
    border-radius: 2px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.6;
    color: #4a3f2c;
    transform: rotate(0.8deg);
    position: relative;
  }
  .note::before {
    content: "📌";
    position: absolute;
    top: -12px;
    left: -10px;
    font-size: 18px;
    transform: rotate(-25deg);
  }
  .grader-badge {
    font-size: 10.5px;
    color: var(--ink-muted);
    margin-top: 10px;
    text-align: right;
  }

  @media (max-width: 480px) {
    .sheet { padding: 28px 18px 28px 44px; }
    .sheet { background-image:
        linear-gradient(to right, transparent 0 24px, var(--margin) 24px 25.5px, transparent 25.5px),
        repeating-linear-gradient(to bottom, transparent 0 34px, var(--rule) 34px 35px);
    }
    .target-text { font-size: 26px; }
    .recognized { font-size: 21px; }
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="kicker"><span>말하기 연습장 <b id="pageNo">No. 1</b></span><span id="itemTag">-</span></div>
  <h1>오늘의 문장을 소리내어 읽어보세요</h1>

  <div class="target-wrap">
    <div class="target-hint">아래 내용을 큰 소리로 정확하게 읽어보세요</div>
    <div class="target-text" id="targetText">불러오는 중...</div>
  </div>

  <div class="practice-area">
    <div class="hold-wrap" id="holdWrap">
      <button class="hold-btn" id="recordBtn" aria-label="누르고 있는 동안 녹음됩니다">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 10v1a7 7 0 0 0 14 0v-1"></path>
          <line x1="12" y1="18" x2="12" y2="22"></line>
          <line x1="8" y1="22" x2="16" y2="22"></line>
        </svg>
      </button>
    </div>
    <div class="hold-label" id="holdLabel">누르고 있는 동안 녹음돼요</div>
    <canvas id="waveform" width="420" height="80"></canvas>
    <button class="draw-btn" id="nextBtn"><span class="draw-icon">🎲</span> 다른 카드 뽑기</button>
    <div class="status" id="status"></div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-card" id="modalCard">
    <button class="modal-close" id="modalClose" aria-label="닫기">✕</button>
    <div class="result-label">✎ 인식된 소리</div>
    <div class="recognized" id="recognizedText"></div>
    <div class="verdict" id="verdict"></div>
    <div class="note" id="noteBox"><span class="feedback" id="feedback"></span></div>
    <audio id="playback" controls></audio>
    <div class="grader-badge" id="graderBadge"></div>
    <div class="modal-actions">
      <button class="modal-btn secondary" id="modalRetry">🔁 다시 녹음</button>
      <button class="modal-btn primary" id="modalNext">🎲 다음 카드</button>
    </div>
  </div>
</div>

<script>
const API = "";
const MAX_MS = 20000;
let items = [];
let currentItem = null;
let drawCount = 0;
let mediaRecorder = null;
let chunks = [];
let recording = false;
let stopTimer = null;
let audioCtx = null, analyser = null, sourceNode = null, rafId = null;
let holdStartTime = 0;

const el = (id) => document.getElementById(id);

async function loadItems() {
  const res = await fetch(`${API}/api/items`);
  items = await res.json();
  drawRandomItem();
}

function drawRandomItem() {
  let next = currentItem;
  if (items.length > 1) {
    while (!next || next.id === currentItem?.id) {
      next = items[Math.floor(Math.random() * items.length)];
    }
  } else {
    next = items[0];
  }
  currentItem = next;
  drawCount += 1;
  el("pageNo").textContent = `No. ${drawCount}`;
  el("itemTag").textContent = `${currentItem.language === "ko" ? "한국어" : "English"} · ${currentItem.level === "word" ? "단어" : "문장"}`;
  el("targetText").textContent = currentItem.text;
  el("playback").style.display = "none";
  el("status").textContent = "";
  closeModal();
}

el("nextBtn").addEventListener("click", (e) => {
  e.currentTarget.classList.add("spin");
  setTimeout(() => e.currentTarget.classList.remove("spin"), 400);
  drawRandomItem();
});

function openModal() { el("modalBackdrop").classList.add("open"); }
function closeModal() { el("modalBackdrop").classList.remove("open"); }
el("modalClose").addEventListener("click", closeModal);
el("modalBackdrop").addEventListener("click", (e) => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
el("modalRetry").addEventListener("click", closeModal);
el("modalNext").addEventListener("click", () => { drawRandomItem(); });

function setupVisualizer(stream) {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  sourceNode = audioCtx.createMediaStreamSource(stream);
  sourceNode.connect(analyser);

  const canvas = el("waveform");
  const ctx = canvas.getContext("2d");
  const bufferLength = analyser.fftSize;
  const dataArray = new Uint8Array(bufferLength);
  const holdWrap = el("holdWrap");

  function render() {
    if (!recording) return;
    rafId = requestAnimationFrame(render);

    const elapsed = performance.now() - holdStartTime;
    holdWrap.style.setProperty("--progress", Math.min(elapsed / MAX_MS, 1).toFixed(3));

    analyser.getByteTimeDomainData(dataArray);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = "#b5432f";
    ctx.beginPath();
    const sliceWidth = canvas.width / bufferLength;
    let x = 0;
    for (let i = 0; i < bufferLength; i++) {
      const v = dataArray[i] / 128.0;
      const y = (v * canvas.height) / 2;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      x += sliceWidth;
    }
    ctx.stroke();
  }
  render();
}

function teardownVisualizer() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  const canvas = el("waveform");
  canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
  el("holdWrap").style.setProperty("--progress", 0);
}

const MIME_CANDIDATES = ["audio/webm", "audio/mp4", "audio/aac", "audio/ogg"];
function pickMimeType() {
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return "";
  return MIME_CANDIDATES.find((t) => MediaRecorder.isTypeSupported(t)) || "";
}

async function beginHold() {
  if (recording) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
        channelCount: 1,
        sampleRate: 16000,
      },
    });
    chunks = [];
    const mimeType = pickMimeType();
    const recorderOpts = { audioBitsPerSecond: 128000 };
    if (mimeType) recorderOpts.mimeType = mimeType;
    mediaRecorder = new MediaRecorder(stream, recorderOpts);
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = onRecordingStop;
    mediaRecorder.start();
    recording = true;
    holdStartTime = performance.now();
    setupVisualizer(stream);
    el("holdWrap").classList.add("active");
    el("holdLabel").textContent = "듣고 있어요… 다 읽으면 손을 떼세요";
    el("status").textContent = "";
    stopTimer = setTimeout(() => endHold(), MAX_MS);
  } catch (err) {
    el("status").textContent = "마이크 접근 권한이 필요합니다: " + err.message;
  }
}

function endHold() {
  if (stopTimer) clearTimeout(stopTimer);
  if (mediaRecorder && recording) {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach((t) => t.stop());
  }
  recording = false;
  teardownVisualizer();
  el("holdWrap").classList.remove("active");
  el("holdLabel").textContent = "누르고 있는 동안 녹음돼요";
}

const recordBtn = el("recordBtn");
recordBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); beginHold(); });
recordBtn.addEventListener("contextmenu", (e) => e.preventDefault());
window.addEventListener("pointerup", () => { if (recording) endHold(); });
window.addEventListener("pointercancel", () => { if (recording) endHold(); });
recordBtn.addEventListener("keydown", (e) => {
  if ((e.code === "Space" || e.code === "Enter") && !e.repeat) { e.preventDefault(); beginHold(); }
});
recordBtn.addEventListener("keyup", (e) => {
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); endHold(); }
});

async function onRecordingStop() {
  const mimeType = mediaRecorder.mimeType || "audio/webm";
  const ext = mimeType.includes("mp4") ? "mp4" : mimeType.includes("ogg") ? "ogg" : "webm";
  const blob = new Blob(chunks, { type: mimeType });
  const url = URL.createObjectURL(blob);
  el("playback").src = url;
  el("playback").style.display = "block";
  el("holdLabel").textContent = "채점 중…";
  el("status").textContent = "";

  const form = new FormData();
  form.append("item_id", currentItem.id);
  form.append("audio", blob, `recording.${ext}`);

  try {
    const res = await fetch(`${API}/api/grade`, { method: "POST", body: form });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    showResult(data);
  } catch (err) {
    el("status").textContent = "채점 실패: " + err.message;
  } finally {
    el("holdLabel").textContent = "누르고 있는 동안 녹음돼요";
  }
}

function showResult(data) {
  const recognizedEl = el("recognizedText");
  recognizedEl.innerHTML = data.diff_ops.map((op) => {
    const text = op.recognized || `[ ${op.target} ]`;
    return `<span class="word ${op.op}">${escapeHtml(text)}</span>`;
  }).join(" ") || "<em>(인식된 내용 없음)</em>";

  const verdictEl = el("verdict");
  verdictEl.textContent = data.correct ? "참 잘했어요" : "다시 읽어볼까요";
  verdictEl.className = "verdict " + (data.correct ? "correct" : "wrong");

  el("feedback").textContent = data.feedback;
  el("graderBadge").textContent = `grader: ${data.grader}`;
  openModal();
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

loadItems();
</script>
</body>
</html>
